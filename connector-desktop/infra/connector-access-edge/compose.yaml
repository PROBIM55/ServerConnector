services:
  connector-access-relay:
    image: haproxy:3.4.5-alpine3.24@sha256:7ffdd3845020aa4c97ffaa56c8cab3ad473ecae0b8ea5e55d2378d663755e092
    restart: unless-stopped
    command: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - bim_web
    labels:
      - traefik.enable=true
      - traefik.docker.network=bim_web
      - traefik.tcp.routers.connector-access.rule=HostSNI(`connector-access.structura-most.ru`)
      - traefik.tcp.routers.connector-access.entrypoints=websecure
      - traefik.tcp.routers.connector-access.tls=true
      - traefik.tcp.routers.connector-access.tls.passthrough=true
      - traefik.tcp.routers.connector-access.service=connector-access
      - traefik.tcp.services.connector-access.loadbalancer.server.port=24443
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  bim_web:
    external: true
    name: bim_web
