[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "structura-ifc-optimizer"
version = "0.1.2"
description = "Offline IFC analysis, exact optimization, and validation engine."
requires-python = ">=3.11,<3.13"
dependencies = [
  "ifcopenshell==0.8.5",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.12.5",
]
package = [
  "pyinstaller>=6.14",
]

[project.scripts]
structura-ifc-optimizer = "structura_ifc_optimizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/structura_ifc_optimizer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
