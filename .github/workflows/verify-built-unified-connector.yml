name: Verify ready clean Platform Connector without product rebuild
on:
  workflow_dispatch:
    inputs:
      producer_run:
        description: Exact run that compiled and retained the installer
        required: true
        type: string
      producer_sha:
        description: Exact reviewed product source commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: clean-platform-connector
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    environment: production
    timeout-minutes: 20
    defaults:
      run: {shell: pwsh}
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCER_RUN: ${{ inputs.producer_run }}
      PRODUCER_SHA: ${{ inputs.producer_sha }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Authenticate compiled bytes and unchanged product source
        run: |
          $ErrorActionPreference='Stop'
          if ($env:PRODUCER_RUN -cnotmatch '^[1-9][0-9]*$' -or $env:PRODUCER_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Exact producer identity required.' }
          $run=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PRODUCER_RUN"|ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -cne 'completed' -or $run.run_attempt -ne 1 -or
              $run.head_sha -cne $env:PRODUCER_SHA -or $run.path -cne '.github/workflows/build-unified-connector-candidate.yml' -or
              $run.event -cne 'workflow_dispatch' -or $run.repository.full_name -cne $env:GITHUB_REPOSITORY) { throw 'Producer run differs.' }
          $jobs=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PRODUCER_RUN/jobs?per_page=100"|ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $jobs.total_count -ne 1) { throw 'Producer job identity differs.' }
          foreach ($stepName in @('Targeted account-session and desktop tests','Download pinned dependencies and build final EXE','Retain compiled EXE and probe before native verification')) {
            $steps=@($jobs.jobs[0].steps|Where-Object name -CEQ $stepName)
            if ($steps.Count -ne 1 -or $steps[0].conclusion -cne 'success') { throw "Producer gate failed: $stepName" }
          }
          $changed=@(git diff --name-only $env:PRODUCER_SHA $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare product source.' }
          $allowed=@('.github/workflows/build-unified-connector-candidate.yml','.github/workflows/verify-built-unified-connector.yml',
            'connector-desktop/installer/Connector.Clean.InstallProbe/Program.cs','connector-desktop/scripts/invoke_hosted_clean_install_fixture.ps1')
          if (@($changed|Where-Object {$_ -cnotin $allowed}).Count) { throw 'Product source differs; a ready-only check cannot verify changed product code.' }
          $items=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PRODUCER_RUN/artifacts?per_page=100"|ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $items.total_count -gt 100) { throw 'Artifact listing failed.' }
          $artifacts=@($items.artifacts|Where-Object {$_.name -ceq 'platform-connector-1.1.8-compiled-unverified' -and !$_.expired})
          if ($artifacts.Count -ne 1) { throw 'One retained compiled artifact is required.' }
          $a=$artifacts[0]
          if ($a.workflow_run.id -ne [long]$env:PRODUCER_RUN -or $a.workflow_run.head_sha -cne $env:PRODUCER_SHA -or
              $a.size_in_bytes -le 0 -or $a.size_in_bytes -gt 3GB -or $a.digest -cnotmatch '^sha256:[a-f0-9]{64}$') { throw 'Compiled artifact identity differs.' }
          $archive=Join-Path $env:RUNNER_TEMP 'compiled.zip'
          gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($a.id)/zip" > $archive
          if ($LASTEXITCODE -ne 0 -or (Get-Item $archive).Length -ne $a.size_in_bytes -or
              (Get-FileHash $archive).Hash.ToLowerInvariant() -cne $a.digest.Substring(7)) { throw 'Compiled artifact bytes differ.' }
          $root=Join-Path $env:RUNNER_TEMP 'compiled';Expand-Archive -LiteralPath $archive -DestinationPath $root
          $exes=@(Get-ChildItem $root -Recurse -File -Filter 'PlatformConnector-1.1.8.exe')
          $manifests=@(Get-ChildItem $root -Recurse -File -Filter release.json)
          if ($exes.Count -ne 1 -or $manifests.Count -ne 1) { throw 'Compiled delivery is ambiguous.' }
          $m=Get-Content $manifests[0].FullName -Raw|ConvertFrom-Json
          if ($m.schemaVersion -ne 1 -or $m.version -cne '1.1.8' -or $m.sourceSha -cne $env:PRODUCER_SHA -or [string]$m.sourceRun -cne $env:PRODUCER_RUN -or
              $m.artifactKind -cne 'unsigned-cloud-candidate' -or $m.authenticodeStatus -cne 'NotSigned' -or
              $m.freshInstallation -isnot [bool] -or !$m.freshInstallation -or
              $m.legacyPayloads -isnot [bool] -or $m.legacyPayloads -or $m.legacyImport -isnot [bool] -or $m.legacyImport -or
              $m.blenderIncluded -isnot [bool] -or $m.blenderIncluded -or
              $m.fileName -cne $exes[0].Name -or $m.bytes -ne $exes[0].Length -or
              $m.sha256 -cne (Get-FileHash $exes[0].FullName).Hash.ToLowerInvariant()) { throw 'Compiled release manifest differs.' }
          $delivery=Join-Path $env:RUNNER_TEMP 'verified-clean-release';New-Item -ItemType Directory -Path $delivery|Out-Null
          Copy-Item -LiteralPath $exes[0].FullName,$manifests[0].FullName -Destination $delivery
      - name: Compile only the verification probe
        run: |
          dotnet publish connector-desktop/installer/Connector.Clean.InstallProbe -c Release -r win-x64 --self-contained true -o (Join-Path $env:RUNNER_TEMP 'ready-probe') -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Native probe compilation failed.' }
      - name: Verify unchanged final EXE under an ordinary user
        run: |
          $delivery=Join-Path $env:RUNNER_TEMP 'verified-clean-release'
          & connector-desktop/scripts/invoke_hosted_clean_install_fixture.ps1 -SetupExecutable (Join-Path $delivery 'PlatformConnector-1.1.8.exe') -ProbeExecutable (Join-Path $env:RUNNER_TEMP 'ready-probe/Connector.Clean.InstallProbe.exe') -EvidenceDirectory (Join-Path $delivery 'evidence')
          @{schemaVersion=1;producerRun=$env:PRODUCER_RUN;runtimeSourceSha=$env:PRODUCER_SHA;verificationSourceSha=$env:GITHUB_SHA;verificationRun=$env:GITHUB_RUN_ID;
            installerSha256=(Get-FileHash (Join-Path $delivery 'PlatformConnector-1.1.8.exe')).Hash.ToLowerInvariant();productRebuilt=$false}|
            ConvertTo-Json|Set-Content (Join-Path $delivery 'verification.json') -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: platform-connector-1.1.8-cloud-tested-unsigned
          path: |
            ${{ runner.temp }}/verified-clean-release/PlatformConnector-1.1.8.exe
            ${{ runner.temp }}/verified-clean-release/release.json
            ${{ runner.temp }}/verified-clean-release/verification.json
            ${{ runner.temp }}/verified-clean-release/evidence/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: clean-ready-diagnostics
          path: |
            ${{ runner.temp }}/verified-clean-release/evidence/*.json
            ${{ runner.temp }}/verified-clean-release/evidence/*.log
          if-no-files-found: ignore
