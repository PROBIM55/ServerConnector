name: Diagnose Ready Installer Exception
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: unified-connector-candidate
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    environment: production
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCER_RUN: '39070880102'
      PRODUCER_SHA: '898edbee94060eabbeb19c701d60683167109a28'
      PRODUCER_DIGEST: 'd81acb864ad006c828df16d01a6393646a3850c5185ef77fb7d3a0e5708a1656'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Retrieve exact previously built runtime
        id: runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $source = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PRODUCER_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $source.head_sha -cne $env:PRODUCER_SHA) { throw 'Runtime source differs.' }
          $items = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PRODUCER_RUN/artifacts" | ConvertFrom-Json
          $artifact = @($items.artifacts | Where-Object name -CEQ 'unverified-runtime-diagnostics-1.1.3')
          if ($artifact.Count -ne 1 -or $artifact[0].expired -or $artifact[0].digest -cne ('sha256:' + $env:PRODUCER_DIGEST)) { throw 'Runtime artifact differs.' }
          $archive = Join-Path $env:RUNNER_TEMP 'runtime.zip'
          gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact[0].id)/zip" > $archive
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $archive).Hash.ToLowerInvariant() -cne $env:PRODUCER_DIGEST) { throw 'Runtime download digest differs.' }
          $root = Join-Path $env:RUNNER_TEMP 'runtime'
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $exe = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'Structura.Connector.Installer.exe')
          if ($exe.Count -ne 1) { throw 'Runtime installer is ambiguous.' }
          $run = Split-Path (Split-Path $exe[0].FullName)
          # The downloaded artifact is intentionally unverified. Only the native tests
          # below can promote these exact bytes into a distributable artifact.
          "run=$run" >> $env:GITHUB_OUTPUT
      - name: Capture exact ready installer exception under ordinary users
        env:
          ACCESS_CONFIGURATION: ${{ secrets.UNIFIED_CONNECTOR_ACCESS_CONFIGURATION_JSON }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Join-Path $env:RUNNER_TEMP 'expected-connector-access.json'
          [IO.File]::WriteAllText($config, (($env:ACCESS_CONFIGURATION | ConvertFrom-Json) | ConvertTo-Json -Depth 30))
          Remove-Item Env:ACCESS_CONFIGURATION
          # Diagnostic-only marker outside the machine MSI's managed directories.
          # The parent and file allow ordinary users to read, never replace them.
          $readyDll = Join-Path '${{ steps.runtime.outputs.run }}' 'bootstrapper/Connector.Upgrade.Bootstrapper.dll'
          if (!(Test-Path -LiteralPath $readyDll -PathType Leaf)) { throw 'Exact ready bootstrapper DLL missing.' }
          $diagnosticRoot = Join-Path $env:ProgramFiles 'PlatformConnectorInstallerDiagnostic'
          if (Test-Path -LiteralPath $diagnosticRoot) { throw 'Fresh diagnostic root already exists.' }
          New-Item -ItemType Directory -Path $diagnosticRoot | Out-Null
          $admins = [Security.Principal.SecurityIdentifier]::new('S-1-5-32-544')
          $acl = [Security.AccessControl.DirectorySecurity]::new()
          $acl.SetOwner($admins)
          $acl.SetAccessRuleProtection($true,$false)
          foreach ($pair in @(@('S-1-5-18','FullControl'),@('S-1-5-32-544','FullControl'),@('S-1-5-32-545','ReadAndExecute'))) {
            $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new(
              [Security.Principal.SecurityIdentifier]::new($pair[0]),
              [Enum]::Parse([Security.AccessControl.FileSystemRights],$pair[1]),
              'ContainerInherit,ObjectInherit','None','Allow'))
          }
          Set-Acl -LiteralPath $diagnosticRoot -AclObject $acl
          $marker = Join-Path $diagnosticRoot 'ready-method.json'
          @{producerSha=$env:PRODUCER_SHA;bootstrapperDllSha256=(Get-FileHash -LiteralPath $readyDll).Hash.ToLowerInvariant()} |
            ConvertTo-Json | Set-Content -LiteralPath $marker -Encoding utf8
          $fileAcl = Get-Acl -LiteralPath $marker
          $fileAcl.SetOwner($admins)
          Set-Acl -LiteralPath $marker -AclObject $fileAcl
          $guard = 'connector-desktop/scripts/resource-guard/platform-build-guard.cs'
          if ((Get-FileHash -LiteralPath $guard).Hash.ToLowerInvariant() -cne '99f6d32467f46042a367fad6383d088432c54a9e181e72a92d397a314a1a4c09') { throw 'Resource guard changed.' }
          Add-Type -Path $guard
          $arguments = @('-NoProfile','-NonInteractive','-File',
            (Join-Path $env:GITHUB_WORKSPACE 'connector-desktop/scripts/invoke_hosted_unified_upgrade_fixture.ps1'),
            '-RunDirectory','${{ steps.runtime.outputs.run }}','-ExpectedConfiguration',$config,'-RuntimeSourceSha',$env:PRODUCER_SHA)
          $exit = [PlatformBuild.Guard]::RunWithPolicy((Get-Command pwsh).Source,$arguments,
            $env:GITHUB_WORKSPACE,'unified-built-runtime-verification',0,$null,[uint64](2GB),[uint64](2GB),100,
            [PlatformBuild.Guard]::MutexName,[Func[PlatformBuild.Guard+Memory]]{ [PlatformBuild.Guard]::ReadMemory() })
          throw "Diagnostic-only run finished ($exit); installer acceptance is unavailable."
      - name: Retain native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-runtime-verification-diagnostics
          path: |
            ${{ steps.runtime.outputs.run }}/native-upgrade-fixture/*.json
            ${{ steps.runtime.outputs.run }}/native-upgrade-fixture/*.log
          if-no-files-found: warn
          retention-days: 3
