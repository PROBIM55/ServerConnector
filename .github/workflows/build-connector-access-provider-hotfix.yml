name: Build Connector NetBird API compatibility

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact public source commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: connector-netbird-api-compat
  cancel-in-progress: false

jobs:
  verify-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify exact source
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if($actual -cne $env:EXPECTED_SHA -or $actual -cnotmatch '^[a-f0-9]{40}$'){throw 'Source commit differs'}
      - name: Test affected provider and endpoint consumer sequentially
        shell: pwsh
        run: |
          foreach($project in @(
            'connector-access/tests/Connector.Access.NetBird.Tests/Connector.Access.NetBird.Tests.csproj',
            'connector-access/tests/Connector.Access.NetBird.AspNetCore.Tests/Connector.Access.NetBird.AspNetCore.Tests.csproj'
          )) {
            dotnet test $project --configuration Release -p:UseSharedCompilation=false -p:BuildInParallel=false --logger trx --results-directory netbird-api-compat/tests --verbosity minimal
            if($LASTEXITCODE -ne 0){throw "Affected tests failed: $project"}
          }
      - name: Pack exact NetBird provider only
        shell: pwsh
        run: |
          dotnet pack connector-access/src/Connector.Access.NetBird/Connector.Access.NetBird.csproj --configuration Release --no-build --no-restore --output netbird-api-compat/packages --verbosity minimal
          if($LASTEXITCODE -ne 0){throw 'NetBird provider pack failed'}
          if(!(Test-Path -LiteralPath 'netbird-api-compat/packages/Connector.Access.NetBird.0.2.11.nupkg')){throw 'Expected package is missing'}
      - name: Write source and output manifest
        shell: pwsh
        run: |
          $root=(Resolve-Path 'netbird-api-compat').Path
          $files=@(Get-ChildItem -LiteralPath $root -File -Recurse|Sort-Object FullName|ForEach-Object{
            @{path=[IO.Path]::GetRelativePath($root,$_.FullName).Replace('\','/');size=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant()}
          })
          @{repository=$env:GITHUB_REPOSITORY;sourceSha=$env:GITHUB_SHA;workflowRunId=$env:GITHUB_RUN_ID;workflowRunAttempt=$env:GITHUB_RUN_ATTEMPT;files=$files}|ConvertTo-Json -Depth 8|Set-Content -LiteralPath 'netbird-api-compat/manifest.json' -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: connector-netbird-api-compat-${{ github.sha }}
          path: netbird-api-compat/
          if-no-files-found: error
          retention-days: 14
