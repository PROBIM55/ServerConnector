name: Build and verify clean Platform Connector
on:
  workflow_dispatch:
    inputs:
      version: {description: "Release semver", required: true, type: string}
      ifc_worker_url: {description: "Pinned IFC worker HTTPS asset", required: true, type: string}
      netbird_msi_url: {description: "Pinned NetBird 0.79 MSI HTTPS asset", required: true, type: string}
permissions:
  contents: read
concurrency:
  group: clean-platform-connector
  cancel-in-progress: false
jobs:
  build-and-install:
    runs-on: windows-latest
    environment: production
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      IFC_WORKER_URL: ${{ inputs.ifc_worker_url }}
      NETBIRD_MSI_URL: ${{ inputs.netbird_msi_url }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.426'}
      - name: Assert exact SDK
        run: |
          if ((dotnet --version) -cne '8.0.426') { throw 'Unexpected release SDK.' }
          dotnet --info
      - name: Targeted account-session and desktop tests
        run: |
          $ErrorActionPreference='Stop'
          node --test connector-desktop/design/tests/connection-ui.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Connection screen regression tests failed.' }
          foreach ($project in @('connector-access/tests/Connector.Access.Client.Tests','connector-access/tests/Connector.Access.Smb.Tests','connector-desktop/tests/Connector.Network.Tests','connector-desktop/Connector.Desktop.Tests')) {
            dotnet test $project -c Release -p:RestoreLockedMode=true -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) { throw "Targeted tests failed: $project" }
          }
      - name: Download pinned dependencies and build final EXE
        env:
          ACCESS_CONFIGURATION: ${{ secrets.UNIFIED_CONNECTOR_ACCESS_CONFIGURATION_JSON }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RELEASE_VERSION -cnotmatch '^\d+\.\d+\.\d+$' -or [string]::IsNullOrWhiteSpace($env:ACCESS_CONFIGURATION)) { throw 'Missing version or protected access configuration.' }
          $assets=Join-Path $env:RUNNER_TEMP 'clean-assets'; New-Item -ItemType Directory -Path $assets | Out-Null
          $access=Join-Path $assets 'connector-access.json'
          $accessConfig=$env:ACCESS_CONFIGURATION|ConvertFrom-Json
          $accessConfig|Add-Member -Force -NotePropertyName smbRoutedDestinations -NotePropertyValue @('62.113.36.107')
          [IO.File]::WriteAllText($access,($accessConfig|ConvertTo-Json -Depth 16),[Text.UTF8Encoding]::new($false)); Remove-Item Env:ACCESS_CONFIGURATION
          $client=[Net.Http.HttpClient]::new()
          try {
            foreach ($asset in @(@($env:IFC_WORKER_URL,'ifc.exe'),@($env:NETBIRD_MSI_URL,'netbird.msi'),@('https://go.microsoft.com/fwlink/?linkid=2124701','webview2.exe'),@('https://github.com/PROBIM55/ServerConnector/releases/download/platform-connector-v1.1.9/PlatformConnector-1.1.9.exe','accepted-1.1.9.exe'))) {
              $uri=[Uri]$asset[0]; if ($uri.Scheme -cne 'https' -or $uri.UserInfo) { throw 'Dependency must use HTTPS.' }
              $response=$client.GetAsync($uri,[Net.Http.HttpCompletionOption]::ResponseHeadersRead).GetAwaiter().GetResult()
              try {
                $response.EnsureSuccessStatusCode() | Out-Null
                if ($response.RequestMessage.RequestUri.Scheme -cne 'https') { throw 'Dependency left HTTPS.' }
                $inputStream=$response.Content.ReadAsStreamAsync().GetAwaiter().GetResult()
                try { $file=[IO.File]::Create((Join-Path $assets $asset[1])); try { $inputStream.CopyTo($file) } finally { $file.Dispose() } } finally { $inputStream.Dispose() }
              } finally { $response.Dispose() }
            }
          } finally { $client.Dispose() }
          & connector-desktop/scripts/prepare_accepted_desktop_predecessor.ps1 -SetupExecutable (Join-Path $assets 'accepted-1.1.9.exe') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'accepted-predecessor')
          & connector-desktop/scripts/build_clean_connector_release.ps1 -Version $env:RELEASE_VERSION -IfcWorkerPath (Join-Path $assets 'ifc.exe') -NetBirdMsiPath (Join-Path $assets 'netbird.msi') -WebView2InstallerPath (Join-Path $assets 'webview2.exe') -ConnectorAccessConfigurationPath $access -AcceptedPredecessorManifest (Join-Path $env:RUNNER_TEMP 'accepted-predecessor/accepted-1.1.9-image.json') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'clean-output')
          dotnet publish connector-desktop/installer/Connector.Clean.InstallProbe -c Release -r win-x64 --self-contained true -p:RuntimeFrameworkVersion=8.0.32 -p:TargetLatestRuntimePatch=false -o (Join-Path $env:RUNNER_TEMP 'clean-probe') -m:1 -nodeReuse:false -p:BuildInParallel=false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Native probe did not compile.' }
          dotnet pack connector-access/src/Connector.Access.Smb -c Release --no-build -p:PackageVersion=0.2.12 -o (Join-Path $env:RUNNER_TEMP 'smb-packages')
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed SMB SDK package was not produced.' }
      - name: Retain compiled EXE and probe before native verification
        uses: actions/upload-artifact@v4
        with:
          name: platform-connector-${{ inputs.version }}-compiled-unverified
          path: |
            ${{ runner.temp }}/clean-output/release/PlatformConnector-*.exe
            ${{ runner.temp }}/clean-output/release/release.json
            ${{ runner.temp }}/clean-output/release/desktop-image-manifest.json
            ${{ runner.temp }}/clean-probe/*
          if-no-files-found: error
          retention-days: 7
      - name: Verify final EXE and actual ordinary-user application
        run: |
          & connector-desktop/scripts/invoke_hosted_clean_install_fixture.ps1 -SetupExecutable (Join-Path $env:RUNNER_TEMP "clean-output/release/PlatformConnector-$env:RELEASE_VERSION.exe") -ProbeExecutable (Join-Path $env:RUNNER_TEMP 'clean-probe/Connector.Clean.InstallProbe.exe') -ImageManifest (Join-Path $env:RUNNER_TEMP 'clean-output/release/desktop-image-manifest.json') -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'clean-output/release/evidence')
          & connector-desktop/scripts/invoke_hosted_clean_install_fixture.ps1 -SetupExecutable (Join-Path $env:RUNNER_TEMP "clean-output/release/PlatformConnector-$env:RELEASE_VERSION.exe") -ProbeExecutable (Join-Path $env:RUNNER_TEMP 'clean-probe/Connector.Clean.InstallProbe.exe') -ImageManifest (Join-Path $env:RUNNER_TEMP 'clean-output/release/desktop-image-manifest.json') -PredecessorSetupExecutable (Join-Path $env:RUNNER_TEMP 'clean-assets/accepted-1.1.9.exe') -PredecessorImageManifest (Join-Path $env:RUNNER_TEMP 'accepted-predecessor/accepted-1.1.9-image.json') -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'clean-output/release/evidence/upgrade119')
      - name: Retain reviewed SMB SDK
        uses: actions/upload-artifact@v4
        with:
          name: connector-smb-0.2.12
          path: ${{ runner.temp }}/smb-packages/*.nupkg
          if-no-files-found: error
      - name: Upload cloud-tested unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: platform-connector-${{ inputs.version }}-cloud-tested-unsigned
          path: |
            ${{ runner.temp }}/clean-output/release/PlatformConnector-*.exe
            ${{ runner.temp }}/clean-output/release/release.json
            ${{ runner.temp }}/clean-output/release/desktop-image-manifest.json
            ${{ runner.temp }}/clean-output/release/evidence/*.json
            ${{ runner.temp }}/clean-output/release/evidence/upgrade119/*.json
          if-no-files-found: error
      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clean-install-diagnostics
          path: |
            ${{ runner.temp }}/clean-output/release/evidence/*.log
            ${{ runner.temp }}/clean-output/release/evidence/*.json
            ${{ runner.temp }}/clean-output/release/evidence/upgrade119/*.log
            ${{ runner.temp }}/clean-output/release/evidence/upgrade119/*.json
          if-no-files-found: ignore
