name: Sign Unified Connector Document
run-name: Connector signature ${{ inputs.request_id }}
# Signs only the machine-helper manifest of the migration helper (schema 4) with UNIFIED_HELPER_MANIFEST_SIGNING_KEY_PEM.
# Release descriptions of the update channels are signed by publish-connector-release.yml and sign-connector-ci-release.yml.
on:
  workflow_dispatch:
    inputs:
      request_id: {required: true, type: string}
      document_base64: {required: true, type: string}
      document_sha256: {required: true, type: string}
      source_sha: {required: true, type: string}
permissions:
  contents: read
jobs:
  sign:
    runs-on: windows-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Sign helper manifest without building or exporting keys
        shell: pwsh
        env:
          SIGN_REQUEST_ID: ${{ inputs.request_id }}
          SIGN_DOCUMENT_BASE64: ${{ inputs.document_base64 }}
          SIGN_DOCUMENT_SHA256: ${{ inputs.document_sha256 }}
          SIGN_SOURCE_SHA: ${{ inputs.source_sha }}
          SIGN_KEY_PEM: ${{ secrets.UNIFIED_HELPER_MANIFEST_SIGNING_KEY_PEM }}
        run: |
          & 'connector-desktop/scripts/sign_release_document_ci.ps1' -OutputDirectory "$env:RUNNER_TEMP/signature"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connector-signature-${{ inputs.request_id }}
          path: ${{ runner.temp }}/signature/document.sig
          if-no-files-found: error
          retention-days: 1
