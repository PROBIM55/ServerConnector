name: Build private Platform cloud candidate
on:
  workflow_dispatch:
    inputs:
      source_sha: {description: Exact private Platform source commit, required: true, type: string}
      public_key_pem: {description: Public RSA key for encrypted output, required: true, type: string}
permissions:
  contents: read
concurrency:
  group: private-platform-cloud-build
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: windows-latest
    environment: production
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DOTNET_GCHeapHardLimit: '0x80000000'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact private source with encrypted outputs
        env:
          PRIVATE_PLATFORM_READ_KEY: ${{ secrets.TEMP_PLATFORM_BUILD_READ_KEY }}
          PRIVATE_SOURCE_SHA: ${{ inputs.source_sha }}
          CLOUD_PUBLIC_KEY_PEM: ${{ inputs.public_key_pem }}
        run: ./.github/scripts/build-private-platform-candidate.ps1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: encrypted-platform-cloud-candidate
          path: |
            ${{ runner.temp }}/platform-cloud-private/payload.enc
            ${{ runner.temp }}/platform-cloud-private/payload.envelope.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-platform-cloud-build-diagnostics
          path: '${{ runner.temp }}/platform-cloud-private/diagnostics.enc.json'
          if-no-files-found: error
          retention-days: 7
